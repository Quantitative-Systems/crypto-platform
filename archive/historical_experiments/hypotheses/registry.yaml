    created_at: "2026-09-19"
    updated_at: "2026-09-19"
    owner: "QCP Research"
    hypothesis_family: "FRACTAL"
    timeframe_sets:
      - "SET_1"
      - "SET_2"
      - "SET_3"
      - "SET_4"
      - "SET_5"
      - "SET_6"
    asset_scope: "CONFIGURABLE_INITIAL_5"
