# registry.yaml — QCP Hypothesis Research Registry
# Version: 1.0.0
# Schema: H-<FAMILY>-<NUMBER>
# IDs are never reused. Entries are never removed (only status updated).
# Human-editable but validated by hypothesis_governance.py.

metadata:
  registry_version: "1.0.0"
  created_at: "2026-09-19"
  description: >
    Permanent, controlled registry of all QCP research hypotheses.
    Every hypothesis is formally captured, versioned, traceable, testable,
    and eventually classified as QUALIFIED, REJECTED, INVALIDATED, or ARCHIVED.
  governance_principle: >
    QCP researches hypotheses; it does not assume them to be true.
  id_format: "H-<FAMILY>-<NUMBER>"
  id_examples:
    - "H-FRACTAL-01"
    - "H-MOMENTUM-01"
    - "H-REVERSION-01"
    - "H-VOLATILITY-01"
  valid_families:
    - FRACTAL
    - MOMENTUM
    - REVERSION
    - VOLATILITY
    - BREAKOUT
    - PULLBACK
    - STRUCTURAL
    - REGIME
    - CARRY
    - COMPOSITE
  valid_lifecycle_states:
    - PROPOSED
    - FORMALIZED
    - IMPLEMENTATION_READY
    - DEVELOPMENT_TEST
    - FORENSIC_REVIEW
    - VALIDATION_CANDIDATE
    - VALIDATION
    - OOS
    - QUALIFIED
    - REJECTED
    - INVALIDATED
    - ARCHIVED
  terminal_states:
    - QUALIFIED
    - REJECTED
    - INVALIDATED
    - ARCHIVED
  valid_transitions:
    PROPOSED:
      - FORMALIZED
      - ARCHIVED
    FORMALIZED:
      - IMPLEMENTATION_READY
      - REJECTED
      - ARCHIVED
    IMPLEMENTATION_READY:
      - DEVELOPMENT_TEST
      - REJECTED
      - ARCHIVED
    DEVELOPMENT_TEST:
      - FORENSIC_REVIEW
      - REJECTED
      - ARCHIVED
    FORENSIC_REVIEW:
      - VALIDATION_CANDIDATE
      - REJECTED
      - ARCHIVED
    VALIDATION_CANDIDATE:
      - VALIDATION
      - REJECTED
      - ARCHIVED
    VALIDATION:
      - OOS
      - REJECTED
      - INVALIDATED
    OOS:
      - QUALIFIED
      - REJECTED
      - INVALIDATED
    QUALIFIED: []
    REJECTED: []
    INVALIDATED: []
    ARCHIVED: []

hypotheses:
