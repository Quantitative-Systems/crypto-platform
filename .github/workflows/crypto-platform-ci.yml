name: Crypto Platform CI — Research Regression, Safety & Android Build

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-verification-and-research-regression:
    name: Quantitative Core, Invariants & Research Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio numpy aiohttp

      - name: Static Security & Secret Audit
        run: |
          python scripts/security_audit.py

      - name: Contract Integrity Verification (Phase Q.2 Hash)
        run: |
          python cli.py verify-contract

      - name: Pre-flight Startup Invariant Validation
        run: |
          python cli.py validate-preflight

      - name: Platform Subsystem Health Check
        run: |
          python cli.py health

      - name: State Reconciliation Audit
        run: |
          python cli.py reconcile

      - name: Run Complete Pytest Suite
        run: |
          pytest -v

      - name: Phase R Historical Replay Regression (9,608 / 9,608 Invariant)
        run: |
          python -m research.experiments.run_phase_r_replay_regression

  android-ci-build-and-test:
    name: Android Test & APK Build
    runs-on: ubuntu-latest
    needs: [python-verification-and-research-regression]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd mobile/android
          ./gradlew test

      - name: Compile and Assemble Debug & Staging APKs
        run: |
          cd mobile/android
          ./gradlew assembleDebug assembleStaging

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-platform-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Staging APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-platform-staging-apk
          path: mobile/android/app/build/outputs/apk/staging/app-staging.apk
          if-no-files-found: error
          retention-days: 14
