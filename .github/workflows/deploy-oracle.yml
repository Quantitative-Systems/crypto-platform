name: Crypto Engine — Build, Test & Oracle Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_action:
        description: "Action to perform"
        required: true
        default: "build-and-test-only"
        type: choice
        options:
          - "build-and-test-only"
          - "deploy-to-oracle"
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm Oracle deployment (ignored if build-and-test-only)'
        required: false
        default: "dry-run"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-test-image:
    name: Build & Verify Docker Image Outside Oracle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Static Security & Capital Safety Audit
        run: |
          python scripts/security_audit.py

      - name: Run Test Suite
        run: |
          pytest tests/unit/test_oracle_deployment_automation.py
          pytest tests/integration/test_production_container_verification.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Repository Name
        id: repo-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.repo-name.outputs.image_name }}:${{ github.sha }}
            ${{ steps.repo-name.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and Test Built Image in Runner Sandbox
        run: |
          IMAGE_TAG="${{ steps.repo-name.outputs.image_name }}:${{ github.sha }}"
          echo "Testing container startup and fail-closed invariants for $IMAGE_TAG..."
          docker run -d --name test-crypto-engine -p 8089:8080 \
            -e REAL_CAPITAL_AUTHORIZED_USD=0.00 \
            -e LIVE_TRADING_ENABLED=false \
            "$IMAGE_TAG"

          # Verify readiness and health
          for i in {1..20}; do
            HEALTH=$(curl -fsS http://127.0.0.1:8089/api/health 2>/dev/null || true)
            if [[ -n "$HEALTH" ]] && [[ "$HEALTH" == *"HEALTHY"* ]] && [[ "$HEALTH" == *"\"real_capital_authorized\": 0.0"* ]]; then
              echo "Container health check passed on attempt $i."
              docker stop test-crypto-engine && docker rm test-crypto-engine
              exit 0
            fi
            echo "Waiting for test container (attempt $i)..."
            sleep 2
          done

          echo "Container failed health check probe."
          docker logs test-crypto-engine || true
          docker rm -f test-crypto-engine || true
          exit 1

  deploy-to-oracle:
    name: Deploy Container to Oracle Cloud VPS
    runs-on: ubuntu-latest
    needs: [build-and-test-image]
    if: ${{ github.event.inputs.deployment_action == 'deploy-to-oracle' && github.event.inputs.confirm_deploy == 'DEPLOY' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Downcase Image Repository Name
        id: repo-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}/crypto-platform"

            # Secure GHCR authentication without echoing token to stdout/stderr
            if [ -n "${{ secrets.GHCR_READ_TOKEN }}" ]; then
              set +x
              printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin > /dev/null 2>&1
            fi

            sync_repo() {
                local target_dir="$1"
                local expected_repo="$2"
                local target_ref="$3"
                local target_sha="$4"

                # 1. Missing directory: perform initial clone safely
                if [ ! -e "${target_dir}" ]; then
                    echo "Destination '${target_dir}' does not exist. Performing initial clone..."
                    if [[ "${expected_repo}" == https://* ]] || [[ "${expected_repo}" == git@* ]] || [[ "${expected_repo}" == file://* ]] || [[ -d "${expected_repo}" ]]; then
                        git clone "${expected_repo}" "${target_dir}"
                    else
                        git clone "https://github.com/${expected_repo}.git" "${target_dir}"
                    fi
                fi

                # 2. Destination exists but is not a directory
                if [ ! -d "${target_dir}" ]; then
                    echo "FATAL: Destination '${target_dir}' exists but is not a directory!" >&2
                    return 1
                fi

                # 3. Existing directory must be a valid Git repository; fail safely if not
                if ! git -C "${target_dir}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                    echo "FATAL: Destination directory '${target_dir}' exists but is not a valid Git repository!" >&2
                    return 1
                fi

                # 4. Verify remote origin matches expected repository
                local remote_url
                remote_url=$(git -C "${target_dir}" config --get remote.origin.url || true)
                if [ -z "${remote_url}" ]; then
                    echo "FATAL: Existing repository at '${target_dir}' has no remote.origin.url configured!" >&2
                    return 1
                fi

                local lower_url lower_expected
                lower_url=$(echo "${remote_url}" | tr '[:upper:]' '[:lower:]' | sed -e 's/\.git$//')
                lower_expected=$(echo "${expected_repo}" | tr '[:upper:]' '[:lower:]' | sed -e 's/\.git$//')
                if [[ "${lower_url}" != *"${lower_expected}"* ]]; then
                    echo "FATAL: Repository origin '${remote_url}' does not match expected repository '${expected_repo}'!" >&2
                    return 1
                fi

                # 5. Fail if working tree has unexpected local changes in tracked files
                if [ -n "$(git -C "${target_dir}" status --porcelain -uno)" ]; then
                    echo "FATAL: Repository at '${target_dir}' has unexpected local modifications in tracked files!" >&2
                    git -C "${target_dir}" status --short -uno >&2
                    return 1
                fi

                # 6. Fetch intended ref and checkout exact target commit SHA
                echo "Fetching revision '${target_ref}' from origin..."
                git -C "${target_dir}" fetch origin "${target_ref}"

                echo "Checking out target commit '${target_sha}'..."
                git -C "${target_dir}" checkout "${target_sha}"

                # 7. Cryptographic confirmation of current HEAD matching target_sha
                local current_sha
                current_sha=$(git -C "${target_dir}" rev-parse HEAD)
                echo "Verified deployment revision: ${current_sha}"
                if [ "${current_sha}" != "${target_sha}" ]; then
                    echo "FATAL: Deployment revision mismatch! Expected '${target_sha}' but checked out '${current_sha}'." >&2
                    return 1
                fi
                return 0
            }

            sync_repo "$APP_DIR" "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}"

            chmod +x "$APP_DIR/scripts/deploy_oracle.sh"
            bash "$APP_DIR/scripts/deploy_oracle.sh" "${{ steps.repo-name.outputs.image_name }}:${{ github.sha }}"
