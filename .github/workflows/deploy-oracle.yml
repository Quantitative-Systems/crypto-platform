name: Crypto Engine — Build, Test & Oracle Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_action:
        description: "Action to perform"
        required: true
        default: "build-and-test-only"
        type: choice
        options:
          - "build-and-test-only"
          - "deploy-to-oracle"
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm Oracle deployment (ignored if build-and-test-only)'
        required: false
        default: "dry-run"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-test-image:
    name: Build & Verify Docker Image Outside Oracle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Static Security & Capital Safety Audit
        run: |
          python scripts/security_audit.py

      - name: Run Test Suite
        run: |
          pytest tests/unit/test_oracle_deployment_automation.py
          pytest tests/integration/test_production_container_verification.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Repository Name
        id: repo-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.repo-name.outputs.image_name }}:${{ github.sha }}
            ${{ steps.repo-name.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and Test Built Image in Runner Sandbox
        run: |
          IMAGE_TAG="${{ steps.repo-name.outputs.image_name }}:${{ github.sha }}"
          echo "Testing container startup and fail-closed invariants for $IMAGE_TAG..."
          docker run -d --name test-crypto-engine -p 8089:8080 \
            -e REAL_CAPITAL_AUTHORIZED_USD=0.00 \
            -e LIVE_TRADING_ENABLED=false \
            "$IMAGE_TAG"

          # Verify readiness and health
          for i in {1..20}; do
            HEALTH=$(curl -fsS http://127.0.0.1:8089/api/health 2>/dev/null || true)
            if [[ -n "$HEALTH" ]] && [[ "$HEALTH" == *"HEALTHY"* ]] && [[ "$HEALTH" == *"\"real_capital_authorized\": 0.0"* ]]; then
              echo "Container health check passed on attempt $i."
              docker stop test-crypto-engine && docker rm test-crypto-engine
              exit 0
            fi
            echo "Waiting for test container (attempt $i)..."
            sleep 2
          done

          echo "Container failed health check probe."
          docker logs test-crypto-engine || true
          docker rm -f test-crypto-engine || true
          exit 1

  deploy-to-oracle:
    name: Deploy Container to Oracle Cloud VPS
    runs-on: ubuntu-latest
    needs: [build-and-test-image]
    if: ${{ github.event.inputs.deployment_action == 'deploy-to-oracle' && github.event.inputs.confirm_deploy == 'DEPLOY' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Downcase Image Repository Name
        id: repo-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Prepare Deployment Synchronizer Script
        id: sync-script
        run: |
          SYNC_B64=$(base64 -w 0 scripts/sync_deployment_repo.sh 2>/dev/null || base64 scripts/sync_deployment_repo.sh | tr -d '\r\n')
          echo "sync_b64=$SYNC_B64" >> $GITHUB_OUTPUT

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SYNC_SCRIPT_B64: ${{ steps.sync-script.outputs.sync_b64 }}
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          envs: SYNC_SCRIPT_B64
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}/crypto-platform"

            # Secure GHCR authentication without echoing token to stdout/stderr
            set +x
            [ -z "${{ secrets.GHCR_READ_TOKEN }}" ] || printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin > /dev/null 2>&1

            # Execute canonical repository synchronizer and safe bootstrap initializer
            SYNC_TMP=$(mktemp /tmp/sync_repo_XXXXXX.sh)
            printf '%s' "$SYNC_SCRIPT_B64" | base64 -d > "$SYNC_TMP"
            chmod +x "$SYNC_TMP"
            bash "$SYNC_TMP" "$APP_DIR" "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}"
            rm -f "$SYNC_TMP"

            chmod +x "$APP_DIR/scripts/deploy_oracle.sh"
            bash "$APP_DIR/scripts/deploy_oracle.sh" "${{ steps.repo-name.outputs.image_name }}:${{ github.sha }}"

