# STRATA Digital Trading Platform — Nginx Reverse Proxy Configuration
# Optimized for High-Throughput REST, Low-Latency WebSockets & Fail-Closed Gateways

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=strata_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=strata_limit burst=50 nodelay;

            proxy_pass http://strata-platform:8080;
            proxy_http_version 1.1;

            # WebSocket Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health probe bypass from rate limits
        location /api/ready {
            proxy_pass http://strata-platform:8080/api/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
