version: "3.8"

services:
  # STRATA Core Application — Autonomous Engine, Terminal & REST API Server
  web-dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: crypto-platform-web
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080", "--mode", "paper"]
    ports:
      - "8080:8080"
    environment:
      - STRATA_ENV=paper
      - REAL_CAPITAL_AUTHORIZED_USD=0.00
      - LIVE_TRADING_ENABLED=false
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    volumes:
      - strata_data:/app/data
      - strata_research:/app/research/results
    healthcheck:
      test: ["CMD-SHELL", "python3 cli.py health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Autonomous Paper Ingestion & Strategy Execution Worker
  forward-paper:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: crypto-platform-paper-worker
    restart: unless-stopped
    command: ["--mode", "paper", "--no-web"]
    environment:
      - STRATA_ENV=paper
      - REAL_CAPITAL_AUTHORIZED_USD=0.00
      - LIVE_TRADING_ENABLED=false
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - strata_data:/app/data
      - strata_research:/app/research/results
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  strata_data:
    driver: local
  strata_research:
    driver: local
