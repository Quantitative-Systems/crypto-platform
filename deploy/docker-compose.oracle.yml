version: "3.8"

# Crypto Engine — Dedicated Production Docker Compose for Oracle Free Tier (1 GB VPS)
# Invariants: Localhost Loopback Only (127.0.0.1:8080), Memory Cap (512MB), Zero Capital ($0.00)

services:
  crypto-engine:
    image: ${IMAGE_NAME:-ghcr.io/quantitative-systems/crypto-platform:latest}
    container_name: crypto-engine
    restart: unless-stopped
    command: ["--mode", "PAPER", "--host", "0.0.0.0", "--port", "8080", "--no-research"]
    ports:
      # Strictly bind to 127.0.0.1 on the host to prevent public port exposure
      - "127.0.0.1:8080:8080"
    environment:
      - ENVIRONMENT=production
      - REAL_CAPITAL_AUTHORIZED_USD=0.00
      - LIVE_TRADING_ENABLED=false
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8080
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    volumes:
      - crypto_platform_data:/app/data
      - crypto_platform_research:/app/research/results
    healthcheck:
      test: ["CMD-SHELL", "python3 cli.py health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crypto_platform_data:
    driver: local
  crypto_platform_research:
    driver: local
