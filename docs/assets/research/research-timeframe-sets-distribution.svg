            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
    </defs>
    <rect width="960" height="480" rx="12" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5"/>
    
