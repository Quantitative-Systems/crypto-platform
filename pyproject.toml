[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-platform"
version = "0.5.0"
description = "Crypto Trading Platform - strategy research, backtesting, validation, portfolio construction and paper-trading infrastructure"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Quantitative Systems Platform Architecture Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy==2.2.6",
    "pandas==3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "anyio==4.13.0",
]
gateways = [
    "ccxt>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "crypto_platform*",
    "market_data*",
    "qcp_platform*",
    "research*",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
